<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Server Status · Docklight</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1417;--surface:#131e22;--surface-raised:#18262a;--line:#26383d;--text:#eaf4f2;--muted:#9bb0b2;--accent:#58d6c4;--warm:#f4c77b;--good:#60d5a3;--warn:#f0bd63;--bad:#f18482;font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -22%,#20433c 0,transparent 48%),var(--bg);color:var(--text)}
    .shell{width:min(760px,calc(100% - 32px));margin:0 auto;padding:42px 0 28px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:52px}.brand{display:inline-flex;align-items:center;gap:11px;color:var(--text);font-weight:720;letter-spacing:.015em;text-decoration:none}.brand img{width:34px;height:34px}.hosted{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.77rem;letter-spacing:.11em;text-transform:uppercase}.hosted i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px #58d6c477}
    .intro{margin-bottom:24px}.eyebrow{color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.intro h1{margin:8px 0 9px;font-size:clamp(2rem,6vw,3.1rem);line-height:1.08;letter-spacing:-.045em}.intro p{margin:0;color:var(--muted)}.summary{display:flex;align-items:center;gap:11px;margin:30px 0 14px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:#111b1eaa;color:var(--muted);font-size:.92rem}.summary i{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 12px #60d5a366}.summary[data-state="empty"] i{background:var(--muted);box-shadow:none}.summary[data-state="starting"] i{background:var(--warn);box-shadow:0 0 12px #f0bd6366}.summary[data-state="offline"] i{background:var(--bad);box-shadow:0 0 12px #f1848266}.summary b{color:var(--text);font-weight:650}.servers{display:grid;gap:10px}.server{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:18px 19px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#172428,#121c1f 75%);box-shadow:0 12px 30px #00000012}.server-main{min-width:0}.server-name{display:block;overflow:hidden;color:var(--text);font-size:1.02rem;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.server-game{display:block;margin-top:3px;color:var(--muted);font-size:.82rem}.server-meta{display:flex;align-items:center;gap:10px;text-align:right}.server-players{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:7px;min-width:94px;justify-content:center;padding:6px 9px;border:1px solid #60d5a334;border-radius:999px;background:#60d5a30d;color:var(--good);font-size:.75rem;font-weight:650}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge[data-status="starting"]{border-color:#f0bd6338;background:#f0bd630d;color:var(--warn)}.badge[data-status="offline"]{border-color:#f1848238;background:#f184820d;color:var(--bad)}.empty,.error{padding:28px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.error{color:var(--bad)}.page-foot{display:flex;justify-content:space-between;gap:16px;margin-top:22px;color:var(--muted);font-size:.78rem}.page-foot a{color:var(--accent);text-decoration:none}.page-foot a:hover{text-decoration:underline}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){.shell{padding-top:26px}.masthead{margin-bottom:38px}.hosted{font-size:.65rem}.server{grid-template-columns:1fr;gap:12px}.server-meta{justify-content:space-between;text-align:left}.page-foot{flex-direction:column;gap:5px}}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f2f7f5;--surface:#fff;--surface-raised:#e7f0ed;--line:#d5e2dd;--text:#172a2b;--muted:#617574;--accent:#087f73;--good:#168259;--warn:#9b6812;--bad:#b63f3a}.summary{background:#ffffffb8}.summary i{box-shadow:0 0 12px #16825944}.summary[data-state="starting"] i{box-shadow:0 0 12px #9b681244}.summary[data-state="offline"] i{box-shadow:0 0 12px #b63f3a44}.server{background:linear-gradient(135deg,#fff,#f6faf8);box-shadow:0 12px 30px #172a2b08}.badge{border-color:#16825935;background:#1682590b}.badge[data-status="starting"]{border-color:#9b681238;background:#9b68120a}.badge[data-status="offline"]{border-color:#b63f3a38;background:#b63f3a0a}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead"><a class="brand" href="/"><img src="/brand.svg" alt=""><span>Docklight</span></a><span class="hosted"><i></i>Service status</span></header>
    <section class="intro"><div class="eyebrow">LIVE FROM THIS DOCKLIGHT PANEL</div><h1 id="page-title">Server Status</h1><p>Availability for the services this host shares publicly.</p></section>
    <div class="summary" id="overall" aria-live="polite"><i></i><span>Loading current status…</span></div>
    <section class="servers" id="servers" aria-label="Public servers"><div class="empty">Loading services…</div></section>
    <footer class="page-foot"><span id="updated">Waiting for the first update</span><span>Docklight · Self-hosted service status</span></footer>
    <p class="sr-only" id="refresh-status" aria-live="polite"></p>
  </main>
  <script src="/status.js" defer></script>
</body>
</html>
