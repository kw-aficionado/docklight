name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an annotated tag
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          verify_ref="refs/verify-tags/${GITHUB_REF_NAME}"
          git fetch --no-tags origin "+${tag_ref}:${verify_ref}"
          test "$(git cat-file -t "${verify_ref}")" = tag
          test "$(git rev-parse "${verify_ref}^{commit}")" = "$GITHUB_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test and vet
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build Linux release binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.repository=${GITHUB_REPOSITORY}" -o "dist/yggdrasil-linux-${arch}" ./cmd/yggdrasil
          done
          (cd dist && sha256sum yggdrasil-linux-amd64 yggdrasil-linux-arm64 > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/yggdrasil-linux-amd64 dist/yggdrasil-linux-arm64 dist/SHA256SUMS --generate-notes
