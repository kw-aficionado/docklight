name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet Go packages
        run: go vet ./...
      - name: Test Go packages
        run: go test -count=1 ./...
      - name: Test browser utilities
        run: node --test web/ui-utils.test.mjs
      - name: Check browser module syntax
        run: node --check --input-type=module < web/app.js

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build static Linux binary
        env:
          GOARCH: ${{ matrix.arch }}
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags='-s -w' -o /tmp/yggdrasil ./cmd/yggdrasil
